<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link rel="shortcut icon" href="Images_port/photo_2026-10-15_23-16-11.jpg" type="image/x-icon">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="header">
        <h1>Today is Stella's birthday 🎉</h1>
        <img id="myfriend" src="Images_port/photo_2026-10-15_23-16-11.jpg" alt="">
        <h2 id="bday-age">53 years old</h2>
        <h4 id="bday-date">15.10.2026</h4>
    </div>

    <div class="gift-section">
        <h2 class="gift-title">Here's how happy we are for you today 🤩😂</h2>
        <h3 class="gift-hint">(Hover over the gift)</h3>
        <div id="happy-gif" class="gift-image" ></div>
    </div>

    <div class="gift-section">
        <h2 class="gift-title">How people react when you enter the room </h2>
        <div id="hot" class="gift-image" ></div>
    </div>

    <div class="gift-section">
        <h2 class="gift-title">If I had to describe you with ONE word</h2>
        <div id="description" class="gift-image" ></div>
    </div>

    <div class="gift-section">
        <h2 class="gift-title">The only person as badass as you</h2>
        <div id="badass" class="gift-image" ></div>
    </div>

    <div class="gift-section  gift-section-last">
        <h2 class="gift-title">This one's for you our friend 🥂🥂</h2>
        <div id="cheers" class="gift-image" ></div>
    </div>
</body>
</html>
